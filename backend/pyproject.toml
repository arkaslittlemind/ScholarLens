[project]
name = "scholarlens-backend"
version = "0.1.0"
description = "ScholarLens API — FastAPI service for the Agentic RAG eligibility engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pydantic-ai-slim[google]>=2.44",
    "chromadb>=1.5",
    "httpx>=0.27",
    "httpx2>=2.13",
    "opentelemetry-sdk>=1.44",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
