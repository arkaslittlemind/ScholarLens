# Merged over otel-collector-config.yaml by docker-compose.grafana.yml. Traces and logs keep
# printing to the collector log and are also sent to Grafana Cloud (Tempo and Loki); metrics
# stay on the local Prometheus endpoint and are also sent to Grafana Cloud's Prometheus (Mimir).
extensions:
  basicauth/grafana:
    client_auth:
      username: ${env:GRAFANA_CLOUD_INSTANCE_ID}
      password: ${env:GRAFANA_CLOUD_API_TOKEN}

exporters:
  otlp_http/grafana:
    endpoint: ${env:GRAFANA_CLOUD_OTLP_ENDPOINT}
    auth:
      authenticator: basicauth/grafana

service:
  extensions: [basicauth/grafana]
  pipelines:
    traces:
      exporters: [debug, otlp_http/grafana]
    metrics:
      exporters: [prometheus, otlp_http/grafana]
    logs:
      exporters: [debug, otlp_http/grafana]
