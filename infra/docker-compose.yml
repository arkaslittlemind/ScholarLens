services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - path: ../backend/.env
        required: false
    environment:
      # In-network ChromaDB address; overrides the host-machine default in .env.
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    volumes:
      - ../backend:/app
    depends_on:
      - chromadb
      - otel-collector
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  chromadb:
    # Pinned by digest (chroma 1.4.4; no matching version tag is published): a floating
    # tag once moved the data directory and silently made the store ephemeral.
    image: chromadb/chroma@sha256:1e0b73a187a28757c572acba508c46f48c9e8b0acaf5c20e6d95cdedce1acdf6
    ports:
      - "8001:8000"
    volumes:
      # The image's /config.yaml sets persist_path to /data.
      - chromadb_data:/data

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"

volumes:
  chromadb_data:
